<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin | Resham & Roots</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="stylesheet" href="styles.css" />
<style>
  .admin-wrap { max-width: 880px; margin: 0 auto; padding: 48px 20px 100px; }
  .admin-header { display:flex; align-items:center; justify-content:space-between; margin-bottom: 32px; }
  .login-box { max-width: 360px; margin: 100px auto; padding: 32px; border: 1px solid rgba(43,38,34,0.1); border-radius: 12px; }
  .admin-table { width: 100%; border-collapse: collapse; margin-top: 24px; }
  .admin-table th, .admin-table td { text-align: left; padding: 10px 8px; border-bottom: 1px solid rgba(43,38,34,0.1); font-size: 14px; vertical-align: middle; }
  .admin-thumb { width: 56px; height: 68px; object-fit: cover; border-radius: 6px; background: rgba(43,38,34,0.05); }
  .admin-form { border: 1px solid rgba(43,38,34,0.1); border-radius: 12px; padding: 24px; margin-top: 12px; }
  .admin-form h2 { font-size: 20px; margin-bottom: 16px; }
  .form-row { display: flex; gap: 12px; flex-wrap: wrap; }
  .form-row .form-field { flex: 1; min-width: 140px; }
  .small-btn { padding: 6px 14px; font-size: 12px; }
  .status-msg { font-size: 13px; margin-top: 10px; }
  .status-msg.error { color: #b3261e; }
  .status-msg.success { color: var(--maroon); }
  select.form-field { background: #fff; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<div id="login-view" class="admin-wrap">
  <div class="login-box">
    <h1 class="heading" style="font-size:24px; margin-bottom:20px;">Admin Login</h1>
    <form id="login-form">
      <input type="email" id="login-email" class="form-field" placeholder="Email" required />
      <input type="password" id="login-password" class="form-field" placeholder="Password" required />
      <button type="submit" class="btn btn-primary" style="width:100%;">Log In</button>
      <p id="login-status" class="status-msg error"></p>
    </form>
  </div>
</div>

<div id="admin-view" class="admin-wrap hidden">
  <div class="admin-header">
    <h1 class="heading" style="font-size:28px;">Resham &amp; Roots — Admin</h1>
    <button id="logout-btn" class="btn btn-secondary small-btn">Log Out</button>
  </div>

  <div class="admin-form">
    <h2 id="form-title">Add a Product</h2>
    <form id="product-form">
      <input type="hidden" id="editing-id" value="" />
      <div class="form-row">
        <input type="text" id="product-name" class="form-field" placeholder="Product name" required />
        <input type="number" id="product-price" class="form-field" placeholder="Price (₹)" min="1" required />
      </div>
      <div class="form-row">
        <select id="product-category" class="form-field" required>
          <option value="" disabled selected>Category</option>
          <option value="sarees">Sarees</option>
          <option value="womens-clothing">Women's Clothing</option>
          <option value="handicrafts">Handicrafts</option>
          <option value="gifting">Gifting</option>
        </select>
        <input type="file" id="product-image" class="form-field" accept="image/*" />
      </div>
      <p style="font-size:12px; color:rgba(43,38,34,0.55); margin:-4px 0 14px;">
        Leave the image field empty when editing to keep the current photo.
      </p>
      <div style="display:flex; gap:10px;">
        <button type="submit" class="btn btn-primary" id="submit-btn">Add Product</button>
        <button type="button" class="btn btn-secondary hidden" id="cancel-edit-btn">Cancel Edit</button>
      </div>
      <p id="form-status" class="status-msg"></p>
    </form>
  </div>

  <table class="admin-table">
    <thead>
      <tr><th></th><th>Name</th><th>Price</th><th>Category</th><th></th></tr>
    </thead>
    <tbody id="products-table-body">
      <tr><td colspan="5" style="padding:20px 8px; color:rgba(43,38,34,0.5);">Loading products…</td></tr>
    </tbody>
  </table>
</div>

<script type="module" src="admin.js"></script>
</body>
</html>
